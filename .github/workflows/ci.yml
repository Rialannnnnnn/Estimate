name: EstiMate checks

on:
  pull_request:
    branches: [main, "fix/**"]
  push:
    branches: [main, "fix/**", "feat/**"]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test budget calculations
        run: pnpm test:budget

      - name: Test AI recommendations
        run: pnpm test:recommendations
